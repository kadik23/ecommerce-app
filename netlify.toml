[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy backend API requests to Render
[[redirects]]
  from = "/api/*"
  to = "https://ecommerce-app-laravel.onrender.com/api/:splat"
  status = 200
  force = true

# Proxy product and uploaded images to Render
[[redirects]]
  from = "/assets/images/*"
  to = "https://ecommerce-app-laravel.onrender.com/assets/images/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
