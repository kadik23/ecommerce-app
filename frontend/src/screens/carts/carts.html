<div>
    <div class="font-bold flex mt-10 text-regal-brown px-10 text-3xl">{{ $t('cart.title') }}</div>
    <nav class="flex mx-10 mt-10 mb-5" aria-label="Breadcrumb">
        <ol class="inline-flex items-center space-x-1 md:space-x-3">
            <li class="inline-flex items-center">
                <router-link to="/"
                    class="inline-flex items-center text-sm font-medium text-gray-700 hover:text-regal-brown dark:text-gray-400 dark:hover:text-white">
                    <svg class="w-3 h-3 me-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                        fill="currentColor" viewBox="0 0 20 20">
                        <path
                            d="m19.707 9.293-2-2-7-7a1 1 0 0 0-1.414 0l-7 7-2 2a1 1 0 0 0 1.414 1.414L2 10.414V18a2 2 0 0 0 2 2h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a2 2 0 0 0 2-2v-7.586l.293.293a1 1 0 0 0 1.414-1.414Z" />
                    </svg>
                    {{ $t('nav.home') }}
                </router-link>
            </li>
            <li>
                <div class="flex items-center">
                    <svg class="w-3 h-3 text-gray-400 mx-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                        fill="none" viewBox="0 0 6 10">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="m1 9 4-4-4-4" />
                    </svg>
                    <router-link to="/carts"
                        class="ms-1 text-sm font-medium text-gray-700 hover:text-regal-brown md:ms-2 dark:text-gray-400 dark:hover:text-white">{{ $t('cart.breadcrumb') }}</router-link>
                </div>
            </li>
        </ol>
    </nav>

    <div v-if="isLoading" class="flex flex-col md:w-2/3 w-full px-10">
        <CartSkeletonVue v-for="i in 3" :key="'cart-skel-' + i" />
    </div>
    <div class="flex flex-wrap lg:flex-row" v-else-if="carts.length > 0">
        <div class="flex flex-col md:w-2/3 w-full">
            <CartItemVue v-for="cart in carts" :key="cart.id" :id="cart.id" :productName="cart.name" sold="23"
                price_sold="5900" :price="cart.price" :description="cart.description" size="13" :img="cart.profileImage || cart.img"
                @increment="incrementQuantity" @decrement="decrementQuantity" @remove="confirmRemoveItem" />
        </div>
        <div class="md:w-1/3 w-full md:m-0 m-5 flex flex-col justify-between h-32 px-5 py-2.5 rounded-sm bg-gray-100 dark:bg-gray-800">
            <p>{{ $t('cart.summary') }} <span class="font-bold">{{ totalPrice }}</span>$</p>
            <div class="pb-2.5">
                <p class="opacity-70 text-xs mb-2">{{ $t('cart.fast_delivery') }}</p>
                <form @submit.prevent="openConfirmOrderModal">
                    <input v-for="cart in carts" :key="cart.id" type="hidden" :id="'hidden' + cart.id"
                        :name="'hidden' + cart.id" :value="quantities[cart.id] || 1">
                    <button type="submit"
                        class="text-white bg-regal-brown hover:bg-amber-700 focus:ring-4 focus:ring-amber-800 font-medium rounded-lg text-sm px-16 w-full py-2 me-2 mb-2 focus:outline-none transition-colors">
                        {{ $t('cart.order_btn') }} ({{ totalPrice }}$)
                    </button>
                </form>
            </div>
        </div>
    </div>
    <div v-else class="flex flex-col items-center justify-center w-full my-20">
        <svg class="w-24 h-24 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
        </svg>
        <p class="text-xl text-gray-500 font-semibold">{{ $t('cart.empty') }}</p>
        <router-link to="/" class="mt-4 btn bg-regal-brown text-white">{{ $t('cart.start_shopping') }}</router-link>
    </div>
    <div class="m-4 flex items-center justify-end">
        <router-link to="/orders" class="btn bg-regal-brown text-white">{{ $t('cart.my_orders') }}</router-link>
    </div>

    <!-- Confirm Order Modal -->
    <PopconfirmModalVue 
        id="confirm_order_modal"
        ref="confirmOrderModal"
        :title="$t('cart.order_confirm_title')"
        :message="$t('cart.order_confirm_msg') + ' (' + totalPrice + '$)'"
        :confirmText="$t('cart.confirm')"
        confirmClass="bg-regal-brown hover:bg-amber-700 text-white"
        titleClass="text-amber-600"
        icon="shopping_cart_checkout"
        @confirm="executeSubmitOrder"
    />

    <!-- Remove Item Modal -->
    <PopconfirmModalVue 
        id="remove_item_modal"
        ref="removeItemModal"
        :title="$t('cart.remove_confirm_title')"
        :message="$t('cart.remove_confirm_msg')"
        :confirmText="$t('product_card.delete')"
        confirmClass="bg-red-600 hover:bg-red-700 text-white"
        titleClass="text-red-600"
        icon="delete"
        @confirm="executeRemoveItem"
    />
</div>
