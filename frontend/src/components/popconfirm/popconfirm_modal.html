<dialog :id="id" class="modal" ref="modalRef">
    <div class="modal-box bg-white dark:bg-gray-800 text-gray-900 dark:text-white">
        <h3 v-if="title" class="font-bold text-lg flex items-center gap-2" :class="titleClass">
            <span class="material-symbols-outlined">{{ icon }}</span>
            {{ title }}
        </h3>
        <p class="py-4 text-sm text-gray-600 dark:text-gray-300">
            {{ message }}
        </p>
        <div class="modal-action flex justify-end gap-3">
            <button type="button" @click="handleCancel" class="btn btn-ghost text-sm">
                {{ cancelText || $t('cart.cancel') }}
            </button>
            <button type="button" @click="handleConfirm" class="btn border-none text-white text-sm" :class="confirmClass">
                {{ confirmText || $t('cart.confirm') }}
            </button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button @click="handleCancel">close</button>
    </form>
</dialog>
